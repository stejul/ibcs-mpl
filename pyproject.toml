[project]
name = "ibcs-mpl"
version = "0.1.0"
description = "IBCS-style charting and reporting toolkit built on Matplotlib"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "Stefan Mikic", email = "stejul@rocketmail.com" }
]
requires-python = ">=3.14"
keywords = ["ibcs", "charts", "reporting", "matplotlib", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
]

[project.urls]
Documentation = "https://github.com/stefmik/ibcs-mpl#readme"
Repository = "https://github.com/stefmik/ibcs-mpl"
Issues = "https://github.com/stefmik/ibcs-mpl/issues"

[project.scripts]
ibcs-mpl = "ibcs_mpl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
